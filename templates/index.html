<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Emergency SOS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fef2f2, #f3f4f6);
            color: #111827;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 25px 18px;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #dc2626;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-top: 0;
        }

        .status {
            width: fit-content;
            margin: 15px auto;
            padding: 7px 14px;
            border-radius: 20px;
            background: #dcfce7;
            color: #15803d;
            font-size: 14px;
            font-weight: bold;
        }

        h2 {
            margin-top: 0;
            color: #1f2937;
        }

        .sos-button {
            display: block;
            width: 180px;
            height: 180px;
            margin: 25px auto;
            border-radius: 50%;
            border: 7px solid #fee2e2;
            background: #dc2626;
            color: white;
            font-size: 34px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.35);
            animation: pulse 2s infinite;
            transition: transform 0.2s;
        }

        .sos-button:hover {
            background: #b91c1c;
            transform: scale(1.04);
        }

        .sos-button:active {
            transform: scale(0.96);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.45);
            }

            70% {
                box-shadow: 0 0 0 18px rgba(220, 38, 38, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
            }
        }

        .cancel-button {
            display: block;
            margin: 10px auto;
            padding: 11px 25px;
            border: none;
            border-radius: 9px;
            background: #6b7280;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .cancel-button:hover {
            background: #4b5563;
        }

        .countdown {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #dc2626;
            min-height: 38px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .add-button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .contact-box {
            padding: 16px;
            margin-top: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #f9fafb;
        }

        .call-button {
            display: inline-block;
            padding: 9px 15px;
            background: #16a34a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .delete-button {
            padding: 9px 15px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

        .history-item {
            padding: 14px;
            margin-top: 10px;
            background: #f9fafb;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            line-height: 1.6;
        }

        .history-delete {
            margin-top: 8px;
            padding: 7px 12px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .section-icon {
            margin-right: 5px;
        }

        @media (max-width: 600px) {

            .container {
                padding: 12px;
            }

            .card {
                padding: 18px;
                border-radius: 14px;
            }

            h1 {
                font-size: 25px;
            }

            .sos-button {
                width: 155px;
                height: 155px;
                font-size: 30px;
            }

            .contact-box>div {
                flex-direction: column;
                align-items: stretch !important;
            }

            .contact-box a,
            .contact-box button {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- SOS -->

        <div class="card">

            <h1>🚨 Smart Emergency SOS</h1>

            <p class="subtitle">
                Quick emergency assistance with location support
            </p>

            <div class="status">
                🟢 System Ready
            </div>

            <div id="countdown" class="countdown"></div>

            <button class="sos-button" onclick="startSOS()">
                SOS
            </button>

            <button class="cancel-button" onclick="cancelSOS()">
                Cancel SOS
            </button>

            <p id="sosMessage" class="message"></p>

        </div>


        <!-- CONTACTS -->

        <div class="card">

            <h2>
                <span class="section-icon">📞</span>
                Emergency Contacts
            </h2>

            <input type="text" id="contactName" placeholder="Enter contact name">

            <input type="tel" id="contactPhone" placeholder="Enter phone number">

            <button class="add-button" onclick="addContact()">
                ➕ Add Emergency Contact
            </button>

            <p id="contactMessage" class="message"></p>

            <div id="contactsList"></div>

        </div>


        <!-- HISTORY -->

        <div class="card">

            <h2>
                <span class="section-icon">📋</span>
                Emergency History
            </h2>

            <div id="historyList">
                <p style="color:#6b7280;">
                    No emergency history yet.
                </p>
            </div>

        </div>

    </div>


    <script>

        let countdownTimer = null;
        let countdownValue = 5;


        /* =========================
           SOS
        ========================= */

        function startSOS() {

            if (countdownTimer) {
                return;
            }

            countdownValue = 5;

            const countdown =
                document.getElementById("countdown");

            const message =
                document.getElementById("sosMessage");

            message.innerText =
                "SOS will activate soon...";

            countdown.innerText =
                "Activating in " + countdownValue;

            countdownTimer = setInterval(function () {

                countdownValue--;

                if (countdownValue <= 0) {

                    clearInterval(countdownTimer);
                    countdownTimer = null;

                    countdown.innerText =
                        "🚨 SOS ACTIVATED";

                    message.innerText =
                        "Emergency alert activated.";

                    if (navigator.geolocation) {

                        navigator.geolocation.getCurrentPosition(

                            function (position) {

                                const location =
                                    position.coords.latitude +
                                    ", " +
                                    position.coords.longitude;

                                saveHistory(
                                    "SOS Activated",
                                    location
                                );

                                showEmergencyAlert(location);
                            },

                            function (error) {

                                console.error(
                                    "Location error:",
                                    error
                                );

                                saveHistory(
                                    "SOS Activated",
                                    "Location unavailable"
                                );

                                showEmergencyAlert(
                                    "Location unavailable"
                                );
                            }
                        );

                    } else {

                        saveHistory(
                            "SOS Activated",
                            "Location unavailable"
                        );

                        showEmergencyAlert(
                            "Location unavailable"
                        );
                    }

                    return;
                }

                countdown.innerText =
                    "Activating in " + countdownValue;

            }, 1000);
        }


        /* =========================
           EMERGENCY SMS ALERT
        ========================= */

        function showEmergencyAlert(location) {

            fetch("/contacts")
                .then(response => response.json())
                .then(contacts => {

                    if (contacts.length === 0) {

                        alert(
                            "SOS activated, but no emergency contacts are saved."
                        );

                        return;
                    }

                    const emergencyMessage =
                        "🚨 EMERGENCY ALERT 🚨\n\n" +
                        "SOS has been activated.\n" +
                        "Please contact me immediately.\n\n" +
                        "📍 My location:\n" +
                        location;

                    const container =
                        document.createElement("div");

                    container.style.cssText = `
                        position:fixed;
                        inset:0;
                        background:rgba(0,0,0,0.65);
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        z-index:9999;
                        padding:20px;
                    `;

                    const box =
                        document.createElement("div");

                    box.style.cssText = `
                        background:white;
                        width:100%;
                        max-width:420px;
                        border-radius:18px;
                        padding:22px;
                        box-shadow:0 15px 40px rgba(0,0,0,0.3);
                    `;

                    box.innerHTML = `
                        <h2 style="
                            margin-top:0;
                            color:#dc2626;
                            text-align:center;
                        ">
                            🚨 Alert Emergency Contact
                        </h2>

                        <p style="
                            color:#555;
                            text-align:center;
                        ">
                            Select a contact to send the SOS alert.
                        </p>

                        <div id="alertContactButtons"></div>

                        <button
                            id="closeAlertBox"
                            style="
                                width:100%;
                                margin-top:12px;
                                padding:12px;
                                border:none;
                                border-radius:9px;
                                background:#6b7280;
                                color:white;
                                font-weight:bold;
                                cursor:pointer;
                            "
                        >
                            Close
                        </button>
                    `;

                    container.appendChild(box);
                    document.body.appendChild(container);

                    const buttons =
                        box.querySelector(
                            "#alertContactButtons"
                        );

                    contacts.forEach(contact => {

                        const button =
                            document.createElement("button");

                        button.type = "button";

                        button.style.cssText = `
                            display:block;
                            width:100%;
                            margin:8px 0;
                            padding:13px;
                            border:none;
                            border-radius:9px;
                            background:#dc2626;
                            color:white;
                            font-weight:bold;
                            cursor:pointer;
                            text-align:left;
                        `;

                        button.innerText =
                            "📱 " +
                            contact.name +
                            " - " +
                            contact.phone;

                        button.onclick = function () {

                            const smsLink =
                                "sms:" +
                                contact.phone +
                                "?body=" +
                                encodeURIComponent(
                                    emergencyMessage
                                );

                            window.location.href =
                                smsLink;
                        };

                        buttons.appendChild(button);
                    });

                    box.querySelector(
                        "#closeAlertBox"
                    ).onclick = function () {

                        container.remove();
                    };

                })
                .catch(error => {

                    console.error(
                        "Emergency contact alert error:",
                        error
                    );

                    alert(
                        "SOS activated, but emergency contacts could not be loaded."
                    );
                });
        }


        /* =========================
           CANCEL SOS
        ========================= */

        function cancelSOS() {

            if (countdownTimer) {

                clearInterval(countdownTimer);
                countdownTimer = null;
            }

            document.getElementById(
                "countdown"
            ).innerText = "";

            document.getElementById(
                "sosMessage"
            ).innerText = "SOS cancelled.";
        }


        /* =========================
           ADD CONTACT
        ========================= */

        function addContact() {

            const name =
                document.getElementById(
                    "contactName"
                ).value.trim();

            const phone =
                document.getElementById(
                    "contactPhone"
                ).value.trim();

            const message =
                document.getElementById(
                    "contactMessage"
                );

            if (!name || !phone) {

                message.innerText =
                    "Please enter name and phone number.";

                return;
            }

            fetch("/add_contact", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    phone: phone
                })

            })

                .then(response => response.json())

                .then(data => {

                    message.innerText =
                        data.message;

                    if (data.success) {

                        document.getElementById(
                            "contactName"
                        ).value = "";

                        document.getElementById(
                            "contactPhone"
                        ).value = "";

                        loadContacts();
                    }

                })

                .catch(error => {

                    console.error(error);

                    message.innerText =
                        "Unable to save contact.";
                });
        }


        /* =========================
           LOAD CONTACTS
        ========================= */

        function loadContacts() {

            fetch("/contacts")

                .then(response => response.json())

                .then(contacts => {

                    const list =
                        document.getElementById(
                            "contactsList"
                        );

                    list.innerHTML = "";

                    if (contacts.length === 0) {

                        list.innerHTML =
                            "<p style='color:#6b7280;'>No emergency contacts added yet.</p>";

                        return;
                    }

                    contacts.forEach(contact => {

                        const contactBox =
                            document.createElement("div");

                        contactBox.className =
                            "contact-box";

                        contactBox.innerHTML = `

                            <div style="
                                display:flex;
                                justify-content:space-between;
                                align-items:center;
                                gap:15px;
                                flex-wrap:wrap;
                            ">

                                <div>

                                    <strong>
                                        👤 ${contact.name}
                                    </strong>

                                    <br>

                                    📞 ${contact.phone}

                                </div>

                                <div style="
                                    display:flex;
                                    gap:8px;
                                    flex-wrap:wrap;
                                ">

                                    <a
                                        href="tel:${contact.phone}"
                                        class="call-button"
                                    >
                                        📱 Call
                                    </a>

                                    <button
                                        type="button"
                                        class="delete-button"
                                        onclick="deleteContact(${contact.id})"
                                    >
                                        🗑️ Delete
                                    </button>

                                </div>

                            </div>
                        `;

                        list.appendChild(contactBox);
                    });

                })

                .catch(error => {

                    console.error(
                        "Contact loading error:",
                        error
                    );
                });
        }


        /* =========================
           DELETE CONTACT
        ========================= */

        function deleteContact(id) {

            const confirmed = confirm(
                "Are you sure you want to delete this emergency contact?"
            );

            if (!confirmed) {
                return;
            }

            fetch(`/delete_contact/${id}`, {

                method: "DELETE"

            })

                .then(response => response.json())

                .then(data => {

                    if (data.success) {

                        alert(
                            "Contact deleted successfully! 🗑️"
                        );

                        loadContacts();

                    } else {

                        alert(
                            data.message ||
                            "Unable to delete contact."
                        );
                    }

                })

                .catch(error => {

                    console.error(
                        "Delete error:",
                        error
                    );

                    alert(
                        "Unable to delete contact."
                    );
                });
        }


        /* =========================
           SAVE HISTORY
        ========================= */

        function saveHistory(event, location) {

            fetch("/save_history", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    event: event,
                    location: location
                })

            })

                .then(response => response.json())

                .then(data => {

                    console.log(
                        "History:",
                        data.message
                    );

                    loadHistory();

                })

                .catch(error => {

                    console.error(
                        "History error:",
                        error
                    );
                });
        }


        /* =========================
           LOAD HISTORY
        ========================= */

        function loadHistory() {

            fetch("/history")

                .then(response => response.json())

                .then(records => {

                    const list =
                        document.getElementById(
                            "historyList"
                        );

                    list.innerHTML = "";

                    if (records.length === 0) {

                        list.innerHTML =
                            "<p style='color:#6b7280;'>No emergency history yet.</p>";

                        return;
                    }

                    records.forEach(record => {

                        const item =
                            document.createElement("div");

                        item.className =
                            "history-item";

                        item.innerHTML = `

                            <strong>
                                🚨 ${record.event}
                            </strong>

                            <br>

                            📍 ${record.location ||
                            "Location unavailable"
                            }

                            <br>

                            🕒 ${record.created_at}

                            <br>

                            <button
                                class="history-delete"
                                onclick="deleteHistory(${record.id})"
                            >
                                🗑️ Delete
                            </button>

                        `;

                        list.appendChild(item);
                    });

                })

                .catch(error => {

                    console.error(
                        "History loading error:",
                        error
                    );
                });
        }


        /* =========================
           DELETE HISTORY
        ========================= */

        function deleteHistory(id) {

            if (!confirm(
                "Delete this emergency history?"
            )) {
                return;
            }

            fetch(`/delete_history/${id}`, {

                method: "DELETE"

            })

                .then(response => response.json())

                .then(data => {

                    if (data.success) {

                        alert(
                            "History deleted successfully!"
                        );

                        loadHistory();

                    } else {

                        alert(
                            data.message ||
                            "Unable to delete history."
                        );
                    }

                })

                .catch(error => {

                    console.error(
                        "History delete error:",
                        error
                    );

                    alert(
                        "Unable to delete history."
                    );
                });
        }


        /* =========================
           PAGE LOAD
        ========================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadContacts();
                loadHistory();

            }
        );

    </script>

</body>

</html>
